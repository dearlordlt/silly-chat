server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Uploads: the app allows images up to ~10 MB; nginx's 1 MB default would
    # reject them here no matter what the outer vhost allows. Keep in sync with
    # the DEPLOY.md note for the outer proxy (15m).
    client_max_body_size 15m;

    # Privacy: no access log (it records client IPs, and uvicorn already logs
    # every /api request). Errors still go to stderr.
    access_log off;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the backend service. SSE needs buffering off.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
